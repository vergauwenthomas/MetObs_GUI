[tool.poetry]
name = "MetObs-GUI"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science"
]
version = "1.0.0a1"
description = "A GUI for the MetObs-toolkit"
authors = ["Thomas Vergauwen <thomas.vergauwen@ugent.be>"]
maintainers = ["Thomas Vergauwen <thomas.vergauwen@ugent.be>"]
license = "LICENSE"
readme = "README.md"
documentation = "https://python-poetry.org/docs/"
packages = [{include = "metobs_gui"}]
keywords = ["meteorology", "observations", "urban climate", "GUI"]



[tool.poetry.dependencies]
python = "^3.10" #sync with toolkit
PyQt5 = "^5.12"
PyQtWebEngine = "^5.12"
metobs_toolkit = "^1.0.2"






[tool.poetry.group.dev.dependencies]
poetry = "^1.8.3"
pre-commit = "^3.8.0"
poetry-plugin-export = "^1.8.0"
ipykernel = "^7.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
